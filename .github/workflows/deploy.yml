# GitHub Actions 自动部署工作流（拓展任务：部署到 GitHub Pages）
# 来源：《部署到GitHub Pages.docx》官方推荐配置
# 工作原理：每次 git push 到 main 分支 → GitHub 自动执行 npm ci + npm run build
#          → 把 dist 目录发布到 GitHub Pages（https://<username>.github.io/<repo>/）
# 使用前提：
#   1. 仓库 Settings → Pages → Source 选择 "GitHub Actions"
#   2. vite.config.js 中 base 已替换为 '/你的仓库名称/'
name: Deploy Vue Site to GitHub Pages

on:
  push:
    branches: [main] # 监听 main 分支的提交

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
